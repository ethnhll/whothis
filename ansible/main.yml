---
- name: Configure system
  hosts: localhost
  connection: local

  vars_files:
    - default.config.yml

  tasks:
    # The whole play is macOS-only. setup.sh and the Makefile already refuse to
    # run off Darwin, so the OS guard lives once here (block-level) rather than
    # being restamped on every task.
    - name: Configure macOS
      when: ansible_facts['os_family'] == "Darwin"
      block:
        # Current Homebrew requires third-party taps to be explicitly trusted
        # before their formulae can be installed. sdkman-cli lives in such a tap,
        # so tap + trust it before the package list (which references
        # sdkman/tap/sdkman-cli) is installed, otherwise the install aborts with
        # "tap trust is required".
        - name: Tap the sdkman tap
          community.general.homebrew_tap:
            name: sdkman/tap
            state: present
            path: "{{ brew_prefix }}/bin"
          tags:
            - homebrew

        # No module covers `brew trust`, so shell out for the trust step.
        - name: Trust the sdkman-cli formula
          ansible.builtin.command:
            cmd: "{{ brew_prefix }}/bin/brew trust --formula sdkman/tap/sdkman-cli"
          changed_when: false
          tags:
            - homebrew

        - name: Install Homebrew packages
          community.general.homebrew:
            name: "{{ homebrew_packages }}"
            state: present
            update_homebrew: true
          tags:
            - homebrew

        - name: Install Homebrew casks
          community.general.homebrew_cask:
            name: "{{ homebrew_casks }}"
            state: present
          tags:
            - homebrew_casks

        # ---- Language toolchains ----
        - name: 'Python: install the latest CPython 3 via uv'
          ansible.builtin.command:
            cmd: "{{ brew_prefix }}/bin/uv python install 3"
          register: uv_python
          changed_when: "'Installed' in (uv_python.stdout + uv_python.stderr)"
          tags:
            - toolchains

        - name: 'Node: install the latest LTS via fnm and set it as default'
          ansible.builtin.shell:
            cmd: |
              set -eo pipefail
              export PATH="{{ brew_prefix }}/bin:$PATH"
              fnm install --lts
              fnm default lts-latest
          args:
            executable: /bin/bash
          register: fnm_node
          changed_when: "'Installing Node' in (fnm_node.stdout + fnm_node.stderr)"
          tags:
            - toolchains

        # Resolves the newest Temurin build for each major (and newest overall)
        # from `sdk list java`, so there are no exact patch versions to keep pinned.
        - name: 'Java: install SDKMAN Temurin builds'
          ansible.builtin.shell:
            cmd: |
              set -eo pipefail
              export SDKMAN_DIR="{{ brew_prefix }}/opt/sdkman-cli/libexec"
              source "$SDKMAN_DIR/bin/sdkman-init.sh"
              export sdkman_auto_answer=true
              ids=$(sdk list java | grep -oE '[0-9]+\.[0-9]+\.[0-9]+-tem')
              for major in {{ sdkman_java_majors | join(' ') }}; do
                id=$(printf '%s\n' "$ids" | grep -E "^${major}\." | head -1 || true)
                if [ -n "$id" ]; then sdk install java "$id"; else echo "no Temurin build for Java $major"; fi
              done
              latest=$(printf '%s\n' "$ids" | head -1)
              [ -n "$latest" ] && sdk install java "$latest" || true
          args:
            executable: /bin/bash
          register: sdkman_java
          changed_when: "'Done installing' in sdkman_java.stdout"
          tags:
            - toolchains

        - name: Stow dotfiles
          ansible.builtin.command:
            cmd: "{{ brew_prefix }}/bin/stow --no-folding --override='.*' -d {{ dotfiles_dir }} -t {{ ansible_env.HOME }} {{ item }}"
          loop: "{{ dotfile_packages }}"
          register: stow_result
          changed_when: stow_result.rc == 0
          tags:
            - dotfiles

        # Mac App Store runs last and never blocks the essential setup above.
        # We deliberately do NOT gate on `mas account`: that command is broken on
        # modern macOS (Apple removed the private API mas used, so it reports
        # "Not signed in" even when you are — mas-cli/mas#417). The old gate meant
        # the install was permanently skipped and re-runs never progressed past
        # the sign-in prompt. Instead we attempt the installs directly: `mas
        # install` still works when you're signed in via the App Store GUI, and
        # only the individual apps fail (non-fatally) when you're not.
        - name: Install Mac App Store apps
          community.general.mas:
            id: "{{ item.id }}"
            state: present
          loop: "{{ mac_app_store_apps }}"
          loop_control:
            label: "{{ item.name }}"
          register: mas_install
          ignore_errors: true
          tags:
            - mas

        - name: Prompt sign-in when App Store installs failed
          when: mas_install is failed
          tags:
            - mas
          block:
            - name: Open the App Store (sign in there; sign-in cannot be automated past 2FA)
              ansible.builtin.command: open -a "App Store"
              changed_when: false
              failed_when: false

            - name: Warn that some App Store apps were skipped
              ansible.builtin.debug:
                msg: >-
                  Some App Store apps could not be installed — you're most likely
                  not signed in. Opened the App Store app for you; sign in there
                  (with 2FA), then re-run: ansible-playbook --tags mas main.yml

        # ---- System hardening ----
        # Touch ID for sudo via /etc/pam.d/sudo_local, which survives OS updates
        # (editing /etc/pam.d/sudo directly gets clobbered by macOS updates).
        - name: 'Security: enable Touch ID for sudo'
          become: true
          ansible.builtin.copy:
            dest: /etc/pam.d/sudo_local
            content: |
              # Managed by whothis. Enables Touch ID for sudo.
              auth       sufficient     pam_tid.so
            owner: root
            group: wheel
            mode: "0444"
          tags:
            - hardening

        - name: 'Security: check application firewall state'
          become: true
          ansible.builtin.command:
            cmd: /usr/libexec/ApplicationFirewall/socketfilterfw --getglobalstate
          register: firewall_state
          changed_when: false
          tags:
            - hardening

        - name: 'Security: enable the application firewall'
          become: true
          ansible.builtin.command:
            cmd: /usr/libexec/ApplicationFirewall/socketfilterfw --setglobalstate on
          when: "'disabled' in firewall_state.stdout"
          tags:
            - hardening

        - name: 'Security: check firewall stealth mode'
          become: true
          ansible.builtin.command:
            cmd: /usr/libexec/ApplicationFirewall/socketfilterfw --getstealthmode
          register: fw_stealth
          changed_when: false
          tags:
            - hardening

        - name: 'Security: enable firewall stealth mode (do not answer pings/scans)'
          become: true
          ansible.builtin.command:
            cmd: /usr/libexec/ApplicationFirewall/socketfilterfw --setstealthmode on
          when: "'disabled' in fw_stealth.stdout"
          tags:
            - hardening

        - name: 'Security: disable the guest account'
          become: true
          community.general.osx_defaults:
            domain: /Library/Preferences/com.apple.loginwindow
            key: GuestEnabled
            type: bool
            value: false
          tags:
            - hardening

        - name: 'Security: disable Bonjour multicast advertisements'
          become: true
          community.general.osx_defaults:
            domain: /Library/Preferences/com.apple.mDNSResponder
            key: NoMulticastAdvertisements
            type: bool
            value: true
          tags:
            - hardening

        - name: 'Privacy: stop submitting diagnostics and usage data to Apple'
          become: true
          community.general.osx_defaults:
            domain: "/Library/Application Support/CrashReporter/DiagnosticMessagesHistory"
            key: AutoSubmit
            type: bool
            value: false
          tags:
            - hardening

        - name: 'Privacy: limit ad tracking'
          community.general.osx_defaults:
            domain: com.apple.AdLib
            key: forceLimitAdTracking
            type: bool
            value: true
          tags:
            - hardening

        # Toggling Remote Login via systemsetup often needs the terminal to have
        # Full Disk Access; warn rather than fail if it can't be applied.
        - name: 'Security: check Remote Login (inbound SSH) state'
          become: true
          ansible.builtin.command:
            cmd: systemsetup -getremotelogin
          register: remote_login
          changed_when: false
          failed_when: false
          tags:
            - hardening

        - name: 'Security: disable Remote Login (inbound SSH)'
          become: true
          ansible.builtin.command:
            cmd: systemsetup -f -setremotelogin off
          register: remote_login_off
          changed_when: remote_login_off.rc == 0
          failed_when: false
          when: "'On' in remote_login.stdout"
          tags:
            - hardening

        - name: 'Security: warn if Remote Login could not be disabled'
          when: remote_login_off.rc is defined and remote_login_off.rc != 0
          ansible.builtin.debug:
            msg: >-
              Could not disable Remote Login automatically (usually needs Full
              Disk Access for your terminal). Turn it off in System Settings >
              General > Sharing > Remote Login, or grant FDA and re-run
              `ansible-playbook --tags hardening main.yml`.
          tags:
            - hardening

        - name: 'Security: check FileVault status'
          become: true
          ansible.builtin.command:
            cmd: fdesetup status
          register: filevault
          changed_when: false
          failed_when: false
          tags:
            - hardening

        - name: 'Security: warn if FileVault (full-disk encryption) is off'
          when: "'FileVault is On' not in filevault.stdout"
          ansible.builtin.debug:
            msg: >-
              FileVault is NOT enabled. Turn on full-disk encryption in System
              Settings > Privacy & Security > FileVault and store the recovery key
              safely. (Not auto-enabled — it generates a recovery key you must save.)
          tags:
            - hardening

        # ---- macOS defaults ------------------------------------------------
        # Added one at a time as they're vetted. Run just these with:
        #   ansible-playbook --tags defaults main.yml
        # macOS caches preferences, so each task notifies a killall handler to
        # restart the owning app and apply the change immediately.
        - name: 'Finder: show all filename extensions'
          community.general.osx_defaults:
            domain: NSGlobalDomain
            key: AppleShowAllExtensions
            type: bool
            value: true
          notify: Restart Finder
          tags:
            - defaults

        - name: 'Finder: show the path bar (folder hierarchy at window bottom)'
          community.general.osx_defaults:
            domain: com.apple.finder
            key: ShowPathbar
            type: bool
            value: true
          notify: Restart Finder
          tags:
            - defaults

        - name: 'Finder: show hidden files'
          community.general.osx_defaults:
            domain: com.apple.finder
            key: AppleShowAllFiles
            type: bool
            value: true
          notify: Restart Finder
          tags:
            - defaults

        # Nlsv=list, icnv=icon, clmv=column, Flwv=gallery. Only sets the default
        # for folders without a saved per-folder view (see note below).
        - name: 'Finder: use list view by default'
          community.general.osx_defaults:
            domain: com.apple.finder
            key: FXPreferredViewStyle
            type: string
            value: Nlsv
          notify: Restart Finder
          tags:
            - defaults

        - name: 'Finder: keep folders on top when sorting by name'
          community.general.osx_defaults:
            domain: com.apple.finder
            key: _FXSortFoldersFirst
            type: bool
            value: true
          notify: Restart Finder
          tags:
            - defaults

        - name: 'Finder: search the current folder by default (not the whole Mac)'
          community.general.osx_defaults:
            domain: com.apple.finder
            key: FXDefaultSearchScope
            type: string
            value: SCcf
          notify: Restart Finder
          tags:
            - defaults

        - name: 'Finder: no warning when changing a file extension'
          community.general.osx_defaults:
            domain: com.apple.finder
            key: FXEnableExtensionChangeWarning
            type: bool
            value: false
          notify: Restart Finder
          tags:
            - defaults

        - name: 'Finder: show full POSIX path in the window title'
          community.general.osx_defaults:
            domain: com.apple.finder
            key: _FXShowPosixPathInTitle
            type: bool
            value: true
          notify: Restart Finder
          tags:
            - defaults

        - name: 'Finder: show internal/external drives and servers on the Desktop'
          community.general.osx_defaults:
            domain: com.apple.finder
            key: "{{ item }}"
            type: bool
            value: true
          loop:
            - ShowHardDrivesOnDesktop
            - ShowExternalHardDrivesOnDesktop
            - ShowMountedServersOnDesktop
          notify: Restart Finder
          tags:
            - defaults

        # desktopservices changes need a logout to take effect (no killall).
        - name: 'Finder: do not write .DS_Store on network and USB shares'
          community.general.osx_defaults:
            domain: com.apple.desktopservices
            key: "{{ item }}"
            type: bool
            value: true
          loop:
            - DSDontWriteNetworkStores
            - DSDontWriteUSBStores
          tags:
            - defaults

        # ---- Dock ----
        - name: 'Dock: auto-hide with no reveal delay'
          community.general.osx_defaults:
            domain: com.apple.dock
            key: autohide
            type: bool
            value: true
          notify: Restart Dock
          tags:
            - defaults

        - name: 'Dock: remove the auto-hide reveal delay'
          community.general.osx_defaults:
            domain: com.apple.dock
            key: autohide-delay
            type: float
            value: 0
          notify: Restart Dock
          tags:
            - defaults

        - name: 'Dock: faster auto-hide animation'
          community.general.osx_defaults:
            domain: com.apple.dock
            key: autohide-time-modifier
            type: float
            value: 0.4
          notify: Restart Dock
          tags:
            - defaults

        # CHOSEN VALUE: 48px icons (medium). Adjust to taste.
        - name: 'Dock: icon size'
          community.general.osx_defaults:
            domain: com.apple.dock
            key: tilesize
            type: int
            value: 48
          notify: Restart Dock
          tags:
            - defaults

        - name: 'Dock: hide the recent-apps section'
          community.general.osx_defaults:
            domain: com.apple.dock
            key: show-recents
            type: bool
            value: false
          notify: Restart Dock
          tags:
            - defaults

        - name: 'Dock: do not auto-rearrange Spaces by most-recent use'
          community.general.osx_defaults:
            domain: com.apple.dock
            key: mru-spaces
            type: bool
            value: false
          notify: Restart Dock
          tags:
            - defaults

        # HEADS UP: static-only makes the Dock show ONLY running apps — your
        # pinned launcher icons disappear from the Dock. Remove this task if you
        # keep app shortcuts in the Dock.
        - name: 'Dock: show only running apps (hides pinned icons)'
          community.general.osx_defaults:
            domain: com.apple.dock
            key: static-only
            type: bool
            value: true
          notify: Restart Dock
          tags:
            - defaults

        # ---- Keyboard & text (NSGlobalDomain) ----
        # These apply per-app on next launch; a full logout applies them
        # everywhere, so there's no handler to notify.
        # Values are in ~15ms units. KeyRepeat 2 = fast repeat; InitialKeyRepeat
        # 10 (~150ms) is about as short as macOS reliably honors (the Settings
        # slider bottoms out at 15; lower than 10 gets clamped/flaky).
        - name: 'Keyboard: fast key repeat rate'
          community.general.osx_defaults:
            domain: NSGlobalDomain
            key: KeyRepeat
            type: int
            value: 2
          tags:
            - defaults

        - name: 'Keyboard: shortest reliable delay before key repeat starts'
          community.general.osx_defaults:
            domain: NSGlobalDomain
            key: InitialKeyRepeat
            type: int
            value: 10
          tags:
            - defaults

        - name: 'Keyboard: hold-to-repeat instead of the accent popup'
          community.general.osx_defaults:
            domain: NSGlobalDomain
            key: ApplePressAndHoldEnabled
            type: bool
            value: false
          tags:
            - defaults

        - name: 'Text: disable smart quotes, smart dashes, autocorrect, auto-caps, and auto-period'
          community.general.osx_defaults:
            domain: NSGlobalDomain
            key: "{{ item }}"
            type: bool
            value: false
          loop:
            - NSAutomaticQuoteSubstitutionEnabled
            - NSAutomaticDashSubstitutionEnabled
            - NSAutomaticSpellingCorrectionEnabled
            - NSAutomaticCapitalizationEnabled
            - NSAutomaticPeriodSubstitutionEnabled
          tags:
            - defaults

        # ---- Screenshots ----
        - name: 'Screenshots: ensure ~/Screenshots exists'
          ansible.builtin.file:
            path: "{{ ansible_env.HOME }}/Screenshots"
            state: directory
            mode: "0755"
          tags:
            - defaults

        - name: 'Screenshots: save to ~/Screenshots instead of the Desktop'
          community.general.osx_defaults:
            domain: com.apple.screencapture
            key: location
            type: string
            value: "{{ ansible_env.HOME }}/Screenshots"
          notify: Restart SystemUIServer
          tags:
            - defaults

        - name: 'Screenshots: use PNG format'
          community.general.osx_defaults:
            domain: com.apple.screencapture
            key: type
            type: string
            value: png
          notify: Restart SystemUIServer
          tags:
            - defaults

        # ---- System & UI ----
        - name: 'Dialogs: expand Save and Print panels by default'
          community.general.osx_defaults:
            domain: NSGlobalDomain
            key: "{{ item }}"
            type: bool
            value: true
          loop:
            - NSNavPanelExpandedStateForSaveMode
            - NSNavPanelExpandedStateForSaveMode2
            - PMPrintingExpandedStateForPrint
            - PMPrintingExpandedStateForPrint2
          tags:
            - defaults

        - name: 'Documents: default Save to disk, not iCloud'
          community.general.osx_defaults:
            domain: NSGlobalDomain
            key: NSDocumentSaveNewDocumentsToCloud
            type: bool
            value: false
          tags:
            - defaults

        # HEADS UP: forces Dark mode; takes effect on next login. Remove if you
        # prefer Light or the automatic Light/Dark switch.
        - name: 'Appearance: use Dark mode'
          community.general.osx_defaults:
            domain: NSGlobalDomain
            key: AppleInterfaceStyle
            type: string
            value: Dark
          tags:
            - defaults

        # ---- Menu bar / Control Center ----
        - name: 'Menu bar: show battery percentage'
          community.general.osx_defaults:
            domain: com.apple.controlcenter
            key: BatteryShowPercentage
            type: bool
            value: true
          notify: Restart ControlCenter
          tags:
            - defaults

        # ---- Trackpad (tap to click; applies on next login) ----
        - name: 'Trackpad: tap to click'
          community.general.osx_defaults:
            domain: "{{ item }}"
            key: Clicking
            type: bool
            value: true
          loop:
            - com.apple.AppleMultitouchTrackpad
            - com.apple.driver.AppleBluetoothMultitouch.trackpad
          tags:
            - defaults

        - name: 'Trackpad: enable tap to click globally (incl. login screen)'
          community.general.osx_defaults:
            domain: NSGlobalDomain
            host: currentHost
            key: com.apple.mouse.tapBehavior
            type: int
            value: 1
          tags:
            - defaults

        # ---- Finder (more) ----
        - name: 'Finder: allow quitting Finder with Cmd+Q'
          community.general.osx_defaults:
            domain: com.apple.finder
            key: QuitMenuItem
            type: bool
            value: true
          notify: Restart Finder
          tags:
            - defaults

        - name: 'Finder: no confirmation when emptying the Trash'
          community.general.osx_defaults:
            domain: com.apple.finder
            key: WarnOnEmptyTrash
            type: bool
            value: false
          notify: Restart Finder
          tags:
            - defaults

        # ---- Keyboard access (applies on next login) ----
        - name: 'Keyboard: full keyboard access — Tab moves between all controls'
          community.general.osx_defaults:
            domain: NSGlobalDomain
            key: AppleKeyboardUIMode
            type: int
            value: 3
          tags:
            - defaults

        # ---- Finder / Dock / TextEdit (batch) ----
        - name: 'Finder: open new windows in the Home folder'
          community.general.osx_defaults:
            domain: com.apple.finder
            key: NewWindowTarget
            type: string
            value: PfHm
          notify: Restart Finder
          tags:
            - defaults

        - name: 'Dock: minimize windows into the app icon'
          community.general.osx_defaults:
            domain: com.apple.dock
            key: minimize-to-application
            type: bool
            value: true
          notify: Restart Dock
          tags:
            - defaults

        - name: 'Finder: enable spring-loaded folders'
          community.general.osx_defaults:
            domain: NSGlobalDomain
            key: com.apple.springing.enabled
            type: bool
            value: true
          notify: Restart Finder
          tags:
            - defaults

        # 0.1s = a brief hover before a folder springs open (not instant).
        - name: 'Finder: short spring-load delay'
          community.general.osx_defaults:
            domain: NSGlobalDomain
            key: com.apple.springing.delay
            type: float
            value: 0.1
          notify: Restart Finder
          tags:
            - defaults

        - name: 'TextEdit: default to plain text'
          community.general.osx_defaults:
            domain: com.apple.TextEdit
            key: RichText
            type: int
            value: 0
          tags:
            - defaults

        - name: 'Dock: enable spring-loading on all Dock items'
          community.general.osx_defaults:
            domain: com.apple.dock
            key: enable-spring-load-actions-on-all-items
            type: bool
            value: true
          notify: Restart Dock
          tags:
            - defaults

        - name: 'Printing: auto-quit the printer app when jobs finish'
          community.general.osx_defaults:
            domain: com.apple.print.PrintingPrefs
            key: Quit When Finished
            type: bool
            value: true
          tags:
            - defaults

        # 100 = "All Processes" — verified against the View menu on macOS 26.5.1.
        - name: 'Activity Monitor: show all processes'
          community.general.osx_defaults:
            domain: com.apple.ActivityMonitor
            key: ShowCategory
            type: int
            value: 100
          tags:
            - defaults

        - name: 'Dock: dim the icons of hidden apps'
          community.general.osx_defaults:
            domain: com.apple.dock
            key: showhidden
            type: bool
            value: true
          notify: Restart Dock
          tags:
            - defaults

        - name: 'Dock: scroll up on an app icon to open App Exposé'
          community.general.osx_defaults:
            domain: com.apple.dock
            key: scroll-to-open
            type: bool
            value: true
          notify: Restart Dock
          tags:
            - defaults

        - name: 'Apps: disable resume — relaunch fresh instead of reopening old windows'
          community.general.osx_defaults:
            domain: NSGlobalDomain
            key: NSQuitAlwaysKeepsWindows
            type: bool
            value: false
          tags:
            - defaults

        - name: 'Privacy: disable personalized Apple advertising'
          community.general.osx_defaults:
            domain: com.apple.AdLib
            key: allowApplePersonalizedAdvertising
            type: bool
            value: false
          tags:
            - defaults

        # Applies on next login (clicking the wallpaper no longer shoves windows aside).
        - name: 'Desktop: do not move windows aside when clicking the wallpaper'
          community.general.osx_defaults:
            domain: com.apple.WindowManager
            key: EnableStandardClickToShowDesktop
            type: bool
            value: false
          tags:
            - defaults

        - name: 'Image Capture: do not auto-open when a device is plugged in'
          community.general.osx_defaults:
            domain: com.apple.ImageCapture
            key: disableHotPlug
            type: bool
            value: true
          tags:
            - defaults

        - name: 'Finder: auto-remove Trash items older than 30 days'
          community.general.osx_defaults:
            domain: com.apple.finder
            key: FXRemoveOldTrashItems
            type: bool
            value: true
          notify: Restart Finder
          tags:
            - defaults

        - name: 'Finder: keep folders on top on the Desktop too'
          community.general.osx_defaults:
            domain: com.apple.finder
            key: _FXSortFoldersFirstOnDesktop
            type: bool
            value: true
          notify: Restart Finder
          tags:
            - defaults

        - name: 'Finder: hide the Recent Tags section in the sidebar'
          community.general.osx_defaults:
            domain: com.apple.finder
            key: ShowRecentTags
            type: bool
            value: false
          notify: Restart Finder
          tags:
            - defaults

        - name: 'Spaces: do not switch Spaces when activating an app with a window elsewhere'
          community.general.osx_defaults:
            domain: NSGlobalDomain
            key: AppleSpacesSwitchOnActivate
            type: bool
            value: false
          tags:
            - defaults

        - name: 'Finder: group files by Kind by default (when Use Groups is on)'
          community.general.osx_defaults:
            domain: com.apple.finder
            key: FXPreferredGroupBy
            type: string
            value: Kind
          notify: Restart Finder
          tags:
            - defaults

        - name: 'Keyboard: use F1–F12 as standard function keys (media keys need Fn)'
          community.general.osx_defaults:
            domain: NSGlobalDomain
            key: com.apple.keyboard.fnState
            type: bool
            value: true
          tags:
            - defaults

        - name: 'Clock: use 24-hour time'
          community.general.osx_defaults:
            domain: NSGlobalDomain
            key: AppleICUForce24HourTime
            type: bool
            value: true
          tags:
            - defaults

        - name: 'Sound: play feedback when changing the volume'
          community.general.osx_defaults:
            domain: NSGlobalDomain
            key: com.apple.sound.beep.feedback
            type: int
            value: 1
          tags:
            - defaults

        - name: 'Windows: move a window by Ctrl+Cmd-dragging anywhere in it'
          community.general.osx_defaults:
            domain: NSGlobalDomain
            key: NSWindowShouldDragOnGesture
            type: bool
            value: true
          tags:
            - defaults

        - name: 'Crash Reporter: suppress the crash dialog when apps crash'
          community.general.osx_defaults:
            domain: com.apple.CrashReporter
            key: DialogType
            type: string
            value: none
          tags:
            - defaults

        - name: 'Magic Mouse: enable right-click'
          community.general.osx_defaults:
            domain: com.apple.driver.AppleBluetoothMultitouch.mouse
            key: MouseButtonMode
            type: string
            value: TwoButton
          tags:
            - defaults

  handlers:
    - name: Restart Finder
      ansible.builtin.command: killall Finder
      changed_when: false
      failed_when: false
    - name: Restart Dock
      ansible.builtin.command: killall Dock
      changed_when: false
      failed_when: false
    - name: Restart SystemUIServer
      ansible.builtin.command: killall SystemUIServer
      changed_when: false
      failed_when: false
    - name: Restart ControlCenter
      ansible.builtin.command: killall ControlCenter
      changed_when: false
      failed_when: false
