---
- name: Configure system
  hosts: localhost
  connection: local

  vars_files:
    - default.config.yml

  tasks:
    - name: Configure macOS
      when: ansible_facts['os_family'] == "Darwin"
      ansible.builtin.include_tasks: tasks/darwin.yml

    - name: Configure Debian-family Linux
      when: ansible_facts['os_family'] == "Debian"
      ansible.builtin.include_tasks: tasks/debian.yml

    - name: Configure shared pieces (Python toolchain, dotfiles)
      ansible.builtin.include_tasks: tasks/common.yml

  handlers:
    - name: Restart Finder
      ansible.builtin.command: killall Finder
      changed_when: false
      failed_when: false
    - name: Restart Dock
      ansible.builtin.command: killall Dock
      changed_when: false
      failed_when: false
    - name: Restart SystemUIServer
      ansible.builtin.command: killall SystemUIServer
      changed_when: false
      failed_when: false
    - name: Restart ControlCenter
      ansible.builtin.command: killall ControlCenter
      changed_when: false
      failed_when: false
